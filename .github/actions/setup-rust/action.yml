name: Setup Rust
description: >
  Install the Rust toolchain with platform targets and a build cache, so
  cargokit can compile the native libraries during the Flutter build. kolibri
  and fjs come from pub.dev; the tlottie wrapper crate lives in
  native/komet_tlottie/rust and pulls tlottie by git rev. cargokit builds its
  artifacts in the Flutter build directory; the shared cargo registry and git
  checkouts are cached alongside the native share transport workspace. The
  message-encryption core is C, not Rust, and is built by CMake from the
  crypto-core submodule.

inputs:
  targets:
    description: Comma-separated rustup targets for the platform being built.
    required: true

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          native/komet_tlottie/rust
          native/komet_share
