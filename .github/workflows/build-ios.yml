name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'test/**'
      - 'scripts/pseudo_sign_ios.py'
      - 'scripts/build_ios_share.sh'
      - 'scripts/sign_ios_appstore.py'
      - 'native/komet_share/**'
      - 'native/komet_tlottie/**'
      - 'native/crypto-core'
      - 'native/crypto-core/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.gitmodules'
      - '.github/workflows/build-ios.yml'
      - '.github/actions/setup-rust/**'
      - '.github/actions/pin-kolibri-crates/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'scripts/pseudo_sign_ios.py'
      - 'scripts/build_ios_share.sh'
      - 'scripts/sign_ios_appstore.py'
      - 'native/komet_share/**'
      - 'native/komet_tlottie/**'
      - 'native/crypto-core'
      - 'native/crypto-core/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.gitmodules'
      - '.github/workflows/build-ios.yml'
      - '.github/actions/setup-rust/**'
      - '.github/actions/pin-kolibri-crates/**'

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Get dependencies
        run: flutter pub get

      - name: Build crypto core for tests
        run: make -C native/crypto-core shared

      - name: Verify native share inbox
        run: |
          swiftc -suppress-warnings ios/Shared/KometShareStore.swift test/native/ios_share_store_test.swift -o /tmp/ios-share-store-tests
          /tmp/ios-share-store-tests
          swiftc -suppress-warnings ios/Shared/KometShareStore.swift ios/Shared/KometShareAccounts.swift test/native/ios_share_accounts_test.swift -o /tmp/ios-share-accounts-tests
          /tmp/ios-share-accounts-tests
          clang -c test/native/komet_share_transport_stub.c -o /tmp/ios-share-transport-stub.o
          swiftc -suppress-warnings -import-objc-header ios/ShareExtension/KometShareTransport.h ios/Shared/KometShareStore.swift ios/ShareExtension/KometShareSender.swift test/native/ios_share_images_test.swift /tmp/ios-share-transport-stub.o -o /tmp/ios-share-image-tests
          /tmp/ios-share-image-tests

      - name: Verify native share transport
        run: |
          cargo test --locked --manifest-path native/komet_share/Cargo.toml
          python3 -m unittest discover -s test/native -p "test_ios_*.py" -v

      - name: Analyze application
        run: flutter analyze lib test tool --no-pub

      - name: Verify sharing and chat interactions
        run: >-
          flutter test --no-pub
          test/share_intent_test.dart
          test/share_inbox_test.dart
          test/shared_file_usage_test.dart
          test/chat_swipe_gestures_test.dart
          test/bottom_navigation_style_test.dart
          test/file_bubble_test.dart
          test/photo_viewer_test.dart
          test/photo_hero_test.dart
          test/media_viewer_video_test.dart
          test/share_composer_bar_test.dart
          test/shared_photo_preview_test.dart
          test/share_account_snapshot_test.dart
          test/share_fingerprint_test.dart
          test/share_recipient_eligibility_test.dart
          test/account_token_store_test.dart
          test/per_chat_json_store_test.dart

      - name: Pin kolibri crates
        uses: ./.github/actions/pin-kolibri-crates

      - name: Build iOS (no codesign)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign -v > ios-build.log 2>&1 || {
            tail -n 180 ios-build.log
            exit 1
          }

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: ios-build.log
          retention-days: 7

      - name: Package unsigned IPA
        run: |
          mkdir -p dist build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -qr ../../dist/Komet-ios-unsigned.ipa Payload)
          rm -rf build/ios/Payload

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: komet-ios-unsigned
          path: dist/Komet-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Install ldid
        run: brew install ldid

      - name: Pseudo-sign with ldid
        run: python3 scripts/pseudo_sign_ios.py build/ios/iphoneos/Runner.app

      - name: Package IPA
        run: |
          mkdir -p dist build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -qr ../../dist/Komet-ios-pseudosigned.ipa Payload)

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: komet-ios-pseudosigned
          path: dist/Komet-ios-pseudosigned.ipa
          if-no-files-found: error
          retention-days: 30
  build-ios-appstore:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check signing secrets
        id: signing
        env:
          APPSTORE_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$APPSTORE_CERTIFICATE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store signing secrets are not set, skipping the App Store build"
          fi

      - uses: actions/checkout@v3
        if: steps.signing.outputs.enabled == 'true'
        with:
          submodules: recursive

      - name: Setup Flutter
        if: steps.signing.outputs.enabled == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Rust
        if: steps.signing.outputs.enabled == 'true'
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios

      - name: Get dependencies
        if: steps.signing.outputs.enabled == 'true'
        run: flutter pub get

      - name: Pin kolibri crates
        if: steps.signing.outputs.enabled == 'true'
        uses: ./.github/actions/pin-kolibri-crates

      - name: Import certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISION_PROFILE_BASE64 }}
          SHARE_PROVISION_PROFILE_BASE64: ${{ secrets.APPSTORE_SHARE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPSTORE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/appstore_cert.p12
          PP_PATH=$RUNNER_TEMP/appstore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/appstore-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/appstore.mobileprovision
          rm -f "$RUNNER_TEMP/appstore-share.mobileprovision"
          if [ -n "$SHARE_PROVISION_PROFILE_BASE64" ]; then
            printf '%s' "$SHARE_PROVISION_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/appstore-share.mobileprovision"
          fi

      - name: Build unsigned app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign --dart-define=is_appstore_build=true

      - name: Find signing identity
        if: steps.signing.outputs.enabled == 'true'
        id: identity
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/appstore-signing.keychain-db
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -Eo '"(Apple Distribution|iOS Distribution|iPhone Distribution)[^"]*"' \
            | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "No distribution identity found in keychain"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Found identity!"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Sign app bundle for App Store
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/appstore-signing.keychain-db
          IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail
          args=(
            build/ios/iphoneos/Runner.app
            --app-profile "$RUNNER_TEMP/appstore.mobileprovision"
            --identity "$IDENTITY"
            --keychain "$KEYCHAIN_PATH"
          )
          if [ -f "$RUNNER_TEMP/appstore-share.mobileprovision" ]; then
            args+=(--share-profile "$RUNNER_TEMP/appstore-share.mobileprovision")
          fi
          python3 scripts/sign_ios_appstore.py "${args[@]}"

      - name: Package IPA
        if: steps.signing.outputs.enabled == 'true'
        run: |
          mkdir -p dist build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -qr ../../dist/Komet-ios-appstore.ipa Payload)

      - name: Upload App Store IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: komet-ios-appstore
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/appstore-signing.keychain-db" || true
