name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p dist build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -qr ../../dist/Komet-ios-unsigned.ipa Payload)
          rm -rf build/ios/Payload

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: komet-ios-unsigned
          path: dist/Komet-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Install ldid
        run: brew install ldid

      - name: Pseudo-sign with ldid
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          ENT="$(mktemp -t ent).plist"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key><true/>
            <key>application-identifier</key><string>ru.komet.app</string>
            <key>keychain-access-groups</key>
            <array><string>ru.komet.app</string></array>
          </dict>
          </plist>
          PLIST
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f -name "*.dylib" -print0 | xargs -0 -I{} ldid -S "{}"
            find "$APP/Frameworks" -type d -name "*.framework" | while read -r fw; do
              bin="$fw/$(basename "$fw" .framework)"
              [ -f "$bin" ] && ldid -S "$bin"
            done
          fi
          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -type d -name "*.appex" | while read -r ext; do
              bin="$ext/$(basename "$ext" .appex)"
              [ -f "$bin" ] && ldid -S"$ENT" "$bin"
            done
          fi
          ldid -S"$ENT" "$APP/Runner"

      - name: Package IPA
        run: |
          mkdir -p dist build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -qr ../../dist/Komet-ios-pseudosigned.ipa Payload)

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: komet-ios-pseudosigned
          path: dist/Komet-ios-pseudosigned.ipa
          if-no-files-found: error
          retention-days: 30
  build-ios-appstore:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios

      - name: Get dependencies
        run: flutter pub get

      - name: Import certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPSTORE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/appstore_cert.p12
          PP_PATH=$RUNNER_TEMP/appstore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/appstore-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/appstore.mobileprovision

      - name: Build unsigned app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign

      - name: Sign app bundle for App Store
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/appstore-signing.keychain-db
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          PP_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          BUNDLE_ID="pw.komet.ios"
          IDENTITY="Apple Distribution"

          # Подменяем bundle id на App Store идентификатор
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName $BUNDLE_ID" "$APP/Info.plist" || true

          # Кладём сам provisioning profile внутрь бандла
          cp "$PP_PATH" "$APP/embedded.mobileprovision"

          # Достаём entitlements прямо из профиля — они уже содержат
          # правильный application-identifier для pw.komet.ios
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          ENT_PATH="$RUNNER_TEMP/appstore.entitlements"
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" > "$ENT_PATH"

          # Подписываем вложенные фреймворки (без entitlements)
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -depth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 \
              | xargs -0 -I{} codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "{}"
          fi

          # Расширения (если появятся) — с entitlements
          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -depth 1 -name "*.appex" -print0 \
              | xargs -0 -I{} codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$ENT_PATH" "{}"
          fi

          # Подписываем само приложение последним
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements "$ENT_PATH" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package IPA
        run: |
          mkdir -p dist build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          (cd build/ios && zip -qr ../../dist/Komet-ios-appstore.ipa Payload)

      - name: Upload App Store IPA
        uses: actions/upload-artifact@v4
        with:
          name: komet-ios-appstore
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/appstore-signing.keychain-db" || true
